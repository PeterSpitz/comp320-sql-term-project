<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101d">
  <title>Starline — Vertical Shooter</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      color: #e7f2ff;
      background: #07101d;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 45%, #142944 0, #07101d 65%);
    }

    .cabinet {
      width: min(100vw, 940px);
      height: min(100vh, 900px);
      min-height: 500px;
      padding: 16px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .topbar, .stats, .footer, .brand {
      display: flex;
      align-items: center;
    }

    .topbar { justify-content: space-between; gap: 14px; }
    .brand { gap: 10px; }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #42d9eb88;
      border-radius: 12px;
      color: #69efff;
      background: #123045;
      font-size: 19px;
    }

    .brand-name { font-size: 14px; font-weight: 800; letter-spacing: .2em; }
    .subtitle, .label, .footer { color: #8299b6; }
    .subtitle { margin-top: 3px; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }
    .stats { gap: 8px; }
    .stat {
      min-width: 82px;
      padding: 8px 11px;
      border: 1px solid #7192b52b;
      border-radius: 9px;
      background: #122137b8;
      text-align: right;
    }
    .label { display: block; font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
    .value { display: block; margin-top: 3px; color: #cde7fa; font-size: 13px; font-weight: 700; }

    .game-frame {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #6e9dc13b;
      border-radius: 16px;
      background: #081426;
      box-shadow: 0 24px 70px #0008, inset 0 0 34px #3679a41c;
    }

    canvas {
      width: auto;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 2 / 3;
      display: block;
      outline: none;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #06101dbb;
      text-align: center;
    }
    .overlay[hidden] { display: none; }
    .panel {
      width: min(100%, 360px);
      padding: 28px 24px;
      border: 1px solid #82c1e844;
      border-radius: 16px;
      background: #101f33ed;
      box-shadow: 0 18px 60px #0008;
    }
    .eyebrow { color: #65e9fa; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 9px 0 8px; font-size: clamp(24px, 5vw, 34px); letter-spacing: .04em; }
    .panel p { margin: 0 auto 18px; color: #a4b8ce; font-size: 13px; line-height: 1.55; }
    button {
      padding: 11px 22px;
      border: 0;
      border-radius: 8px;
      color: #06121d;
      background: #68e8f4;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: #a0f4fc; }
    .footer {
      justify-content: space-between;
      gap: 10px;
      font-size: 9px;
      letter-spacing: .06em;
    }
    .key {
      display: inline-block;
      margin: 0 2px;
      padding: 3px 5px;
      border: 1px solid #8199b33a;
      border-radius: 4px;
      color: #cfdeee;
      background: #203047;
      font-size: 8px;
    }
    @media (max-width: 560px) {
      .cabinet { height: 100dvh; min-height: 0; padding: 9px; gap: 8px; }
      .brand-name { font-size: 11px; }
      .subtitle { display: none; }
      .brand-mark { width: 30px; height: 30px; }
      .stats { gap: 4px; }
      .stat { min-width: 57px; padding: 6px; }
      .label { font-size: 7px; }
      .value { font-size: 11px; }
      .footer { font-size: 7px; }
      .game-frame { border-radius: 11px; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="brand-name">STARLINE</div>
          <div class="subtitle">Sector 07 · Deep space run</div>
        </div>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat"><span class="label">Score</span><span class="value" id="score">000000</span></div>
        <div class="stat"><span class="label">Hull</span><span class="value" id="hull">♥ ♥ ♥</span></div>
        <div class="stat"><span class="label">Mission</span><span class="value" id="mission">READY</span></div>
      </div>
    </header>
    <section class="game-frame" aria-label="Starline vertical shooter">
      <canvas id="game" width="480" height="720" tabindex="0"
        aria-label="Move with WASD or arrow keys, fire with space or click, pause with P."></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <div class="eyebrow" id="eyebrow">Mission briefing</div>
          <h1 id="title">Defend the Starline</h1>
          <p id="message">Fly through enemy waves, collect weapon drops, and take down the sector boss.</p>
          <button id="start">Launch mission</button>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div><span class="key">WASD</span> / <span class="key">↑ ↓ ← →</span> MOVE <span class="key">SPACE</span> FIRE</div>
      <div><span class="key">P</span> PAUSE · CLICK / TOUCH TO STEER + FIRE</div>
    </footer>
  </main>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const scoreDisplay = document.getElementById("score");
      const hullDisplay = document.getElementById("hull");
      const missionDisplay = document.getElementById("mission");
      const titleDisplay = document.getElementById("title");
      const messageDisplay = document.getElementById("message");
      const eyebrowDisplay = document.getElementById("eyebrow");
      const startButton = document.getElementById("start");
      const W = canvas.width;
      const H = canvas.height;
      const LEVEL_DISTANCE = 10000;
      const SCROLL_SPEED = 150;
      const BOSS_FINAL_Y = H * 0.2;
      const BOSS_ARRIVAL_DISTANCE = LEVEL_DISTANCE - H * 0.32;

      const enemyTypes = {
        scout: { hp: 1, radius: 13, speed: 105, score: 100, color: "#ff718e", fire: 0 },
        weaver: { hp: 2, radius: 15, speed: 78, score: 180, color: "#ffb56c", fire: 2.2 },
        gunner: { hp: 3, radius: 17, speed: 58, score: 280, color: "#c38bff", fire: 1.5 },
        tank: { hp: 7, radius: 23, speed: 40, score: 520, color: "#ff536d", fire: 1.25 },
        boss: { hp: 100, radius: 58, score: 6000, color: "#ff426f", fire: 0.68 }
      };

      const waves = [
        { at: 0.015, type: "scout", lane: 50, count: 1 },
        { at: 0.09, type: "scout", lane: 27, count: 2 },
        { at: 0.16, type: "weaver", lane: 72, count: 2 },
        { at: 0.23, type: "scout", lane: 18, count: 3 },
        { at: 0.30, type: "gunner", lane: 50, count: 1, drop: "rapid" },
        { at: 0.37, type: "weaver", lane: 78, count: 3 },
        { at: 0.44, type: "tank", lane: 34, count: 1, drop: "spread" },
        { at: 0.51, type: "gunner", lane: 68, count: 2 },
        { at: 0.58, type: "scout", lane: 22, count: 4 },
        { at: 0.65, type: "tank", lane: 72, count: 1, drop: "rapid" },
        { at: 0.72, type: "weaver", lane: 42, count: 3 },
        { at: 0.79, type: "gunner", lane: 24, count: 2, drop: "spread" },
        { at: 0.86, type: "tank", lane: 53, count: 2 },
        { at: 0.92, type: "weaver", lane: 76, count: 4 },
        { at: 0.955, type: "gunner", lane: 36, count: 3 }
      ];

      const powerupInserts = {
        rapid: { weaponId: 2, color: "#73f3c0", fireInterval: 0.105 },
        spread: { weaponId: 3, color: "#86bcff", fireInterval: 0.24 }
      };

      const keys = new Set();
      const stars = Array.from({ length: 100 }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        size: 0.5 + Math.random() * 1.8, speed: 18 + Math.random() * 80,
        alpha: 0.2 + Math.random() * 0.7
      }));

      let state = "ready";
      let lastTime = 0;
      let scroll = 0;
      let score = 0;
      let waveIndex = 0;
      let bossSpawned = false;
      let fireTimer = 0;
      let pointerDown = false;
      let pointerTarget = null;
      let player;
      let enemies = [];
      let playerShots = [];
      let enemyShots = [];
      let powerups = [];
      let particles = [];

      function reset() {
        scroll = 0;
        score = 0;
        waveIndex = 0;
        bossSpawned = false;
        fireTimer = 0;
        enemies = [];
        playerShots = [];
        enemyShots = [];
        powerups = [];
        particles = [];
        player = {
          x: W / 2, y: H * 0.8, radius: 13, speed: 280,
          lives: 3, rapidFor: 0, spreadFor: 0, invulnerable: 1.5
        };
        state = "playing";
        overlay.hidden = true;
        missionDisplay.textContent = "IN FLIGHT";
        updateHud();
        canvas.focus();
      }

      function showOverlay(kind) {
        overlay.hidden = false;
        if (kind === "paused") {
          eyebrowDisplay.textContent = "Flight paused";
          titleDisplay.textContent = "Take a breather";
          messageDisplay.textContent = "Your mission is waiting. Press P or resume when you're ready.";
          startButton.textContent = "Resume";
          missionDisplay.textContent = "PAUSED";
        } else if (kind === "gameover") {
          eyebrowDisplay.textContent = "Ship lost";
          titleDisplay.textContent = "Mission failed";
          messageDisplay.textContent = `Final score: ${score.toLocaleString()}. Re-launch and try again.`;
          startButton.textContent = "Try again";
          missionDisplay.textContent = "HULL LOST";
        } else {
          eyebrowDisplay.textContent = "Sector cleared";
          titleDisplay.textContent = "Boss defeated";
          messageDisplay.textContent = `You cleared the sector with ${score.toLocaleString()} points.`;
          startButton.textContent = "Play again";
          missionDisplay.textContent = "COMPLETE";
        }
      }

      function startOrResume() {
        if (state === "ready" || state === "gameover" || state === "victory") reset();
        else if (state === "paused") {
          state = "playing";
          overlay.hidden = true;
          missionDisplay.textContent = "IN FLIGHT";
          canvas.focus();
        }
      }

      function spawnWave(wave) {
        const style = enemyTypes[wave.type];
        for (let i = 0; i < wave.count; i++) {
          const offset = (i - (wave.count - 1) / 2) * 38;
          enemies.push({
            type: wave.type, x: W * wave.lane / 100 + offset,
            y: -style.radius - i * 27, radius: style.radius,
            hp: style.hp, maxHp: style.hp, speed: style.speed,
            score: style.score, color: style.color, fireRate: style.fire,
            fireTimer: 0.8 + Math.random() * 0.8, phase: Math.random() * 6.28,
            drop: wave.drop || null
          });
        }
      }

      function spawnBoss() {
        const style = enemyTypes.boss;
        enemies.push({
          type: "boss", x: W / 2, y: BOSS_FINAL_Y, worldY: LEVEL_DISTANCE + BOSS_FINAL_Y,
          radius: style.radius, hp: style.hp, maxHp: style.hp, score: style.score,
          color: style.color, fireRate: style.fire, fireTimer: 1.1, phase: 0,
          drop: null
        });
        missionDisplay.textContent = "BOSS";
      }

      function addPlayerShot(xOffset, xVelocity) {
        playerShots.push({
          x: player.x + xOffset, y: player.y - 17, vx: xVelocity,
          vy: -590, radius: 4
        });
      }

      function firePlayer() {
        if (player.spreadFor > 0) {
          addPlayerShot(-8, -150);
          addPlayerShot(0, 0);
          addPlayerShot(8, 150);
        } else addPlayerShot(0, 0);
      }

      function fireEnemy(enemy) {
        if (enemy.type === "boss") {
          for (let i = -2; i <= 2; i++) {
            enemyShots.push({
              x: enemy.x + i * 18, y: enemy.y + 38,
              vx: i * 48 + (player.x - enemy.x) * 0.035,
              vy: 205, radius: 6, color: "#ff6682"
            });
          }
          return;
        }
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const length = Math.hypot(dx, dy) || 1;
        enemyShots.push({
          x: enemy.x, y: enemy.y + enemy.radius,
          vx: dx / length * 120, vy: dy / length * 120,
          radius: 4, color: "#ff9b80"
        });
      }

      function burst(x, y, color, count, force) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = force * (0.3 + Math.random() * 0.8);
          const life = 0.25 + Math.random() * 0.5;
          particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life, maxLife: life, color, size: 1.5 + Math.random() * 3
          });
        }
      }

      function insertPowerup(enemy) {
        if (!enemy.drop && Math.random() > 0.3) return;
        const type = enemy.drop || (Math.random() < 0.55 ? "rapid" : "spread");
        const insert = powerupInserts[type];
        powerups.push({
          x: enemy.x, y: enemy.y, vx: (Math.random() - 0.5) * 28,
          vy: 82, radius: 12, type, weaponId: insert.weaponId,
          color: insert.color,
          phase: 0
        });
      }

      function collectPowerup(powerup) {
        player.weapon = powerup.weaponId;
        if (powerup.type === "rapid") {
          player.rapidFor = 10;
          player.spreadFor = 0;
        } else {
          player.spreadFor = 10;
          player.rapidFor = 0;
        }
        score += 150;
        burst(powerup.x, powerup.y, powerup.color, 15, 100);
      }

      function updateHud() {
        scoreDisplay.textContent = String(score).padStart(6, "0");
        hullDisplay.textContent = `${"♥ ".repeat(Math.max(0, player.lives)).trim()}${player.lives ? "" : "—"}`;
      }

      function damagePlayer() {
        if (player.invulnerable > 0 || state !== "playing") return;
        player.lives--;
        player.invulnerable = 1.35;
        burst(player.x, player.y, "#ff718e", 20, 145);
        updateHud();
        if (player.lives <= 0) {
          state = "gameover";
          showOverlay("gameover");
        }
      }

      function update(dt) {
        for (const star of stars) {
          star.y += star.speed * dt;
          if (star.y > H) { star.y = -2; star.x = Math.random() * W; }
        }
        if (state !== "playing") {
          updateParticles(dt);
          return;
        }

        scroll = Math.min(LEVEL_DISTANCE, scroll + SCROLL_SPEED * dt);
        while (waveIndex < waves.length && scroll >= waves[waveIndex].at * LEVEL_DISTANCE) {
          spawnWave(waves[waveIndex++]);
        }
        if (!bossSpawned && scroll >= BOSS_ARRIVAL_DISTANCE) {
          bossSpawned = true;
          spawnBoss();
        }

        player.invulnerable = Math.max(0, player.invulnerable - dt);
        player.rapidFor = Math.max(0, player.rapidFor - dt);
        player.spreadFor = Math.max(0, player.spreadFor - dt);
        let dx = 0;
        let dy = 0;
        if (keys.has("ArrowLeft") || keys.has("a")) dx--;
        if (keys.has("ArrowRight") || keys.has("d")) dx++;
        if (keys.has("ArrowUp") || keys.has("w")) dy--;
        if (keys.has("ArrowDown") || keys.has("s")) dy++;
        const length = Math.hypot(dx, dy) || 1;
        player.x += dx / length * player.speed * dt;
        player.y += dy / length * player.speed * dt;
        if (pointerTarget) {
          player.x += (pointerTarget.x - player.x) * Math.min(1, dt * 9);
          player.y += (pointerTarget.y - player.y) * Math.min(1, dt * 9);
        }
        player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

        fireTimer -= dt;
        if ((keys.has(" ") || pointerDown) && fireTimer <= 0) {
          firePlayer();
          fireTimer = player.rapidFor > 0
            ? powerupInserts.rapid.fireInterval
            : powerupInserts.spread.fireInterval;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          enemy.phase += dt * (enemy.type === "boss" ? 0.8 : 1.8);
          if (enemy.type === "boss") {
            enemy.y = enemy.worldY - scroll;
            enemy.x = W / 2 + Math.sin(enemy.phase) * 115;
          } else {
            enemy.y += enemy.speed * dt;
            if (enemy.type === "weaver") enemy.x += Math.sin(enemy.phase) * 65 * dt;
            if (enemy.type === "gunner") enemy.x += Math.sin(enemy.phase) * 18 * dt;
          }
          enemy.x = Math.max(enemy.radius + 4, Math.min(W - enemy.radius - 4, enemy.x));
          if (enemy.fireRate > 0) {
            enemy.fireTimer -= dt;
            if (enemy.fireTimer <= 0 && enemy.y > 0 && enemy.y < H * 0.76) {
              fireEnemy(enemy);
              enemy.fireTimer = enemy.fireRate;
            }
          }
          if (enemy.type !== "boss" && enemy.y > H + enemy.radius) enemies.splice(i, 1);
        }

        updateShots(dt);
        updateHits();
        updatePowerups(dt);
        updateParticles(dt);
        updateHud();
      }

      function updateShots(dt) {
        for (let i = playerShots.length - 1; i >= 0; i--) {
          const shot = playerShots[i];
          shot.x += shot.vx * dt;
          shot.y += shot.vy * dt;
          if (shot.y < -10 || shot.x < -10 || shot.x > W + 10) playerShots.splice(i, 1);
        }
        for (let i = enemyShots.length - 1; i >= 0; i--) {
          const shot = enemyShots[i];
          shot.x += shot.vx * dt;
          shot.y += shot.vy * dt;
          if (shot.y > H + 10 || shot.x < -10 || shot.x > W + 10) {
            enemyShots.splice(i, 1);
          } else if (Math.hypot(shot.x - player.x, shot.y - player.y) < shot.radius + player.radius * 0.72) {
            enemyShots.splice(i, 1);
            damagePlayer();
          }
        }
      }

      function updateHits() {
        for (let b = playerShots.length - 1; b >= 0; b--) {
          const shot = playerShots[b];
          let hit = false;
          for (let e = enemies.length - 1; e >= 0; e--) {
            const enemy = enemies[e];
            if (Math.hypot(shot.x - enemy.x, shot.y - enemy.y) >= shot.radius + enemy.radius * 0.8) continue;
            enemy.hp--;
            playerShots.splice(b, 1);
            burst(shot.x, shot.y, enemy.color, 4, 55);
            hit = true;
            if (enemy.hp <= 0) {
              score += enemy.score;
              burst(enemy.x, enemy.y, enemy.color, enemy.type === "boss" ? 70 : 18, 130);
              if (enemy.type !== "boss") insertPowerup(enemy);
              enemies.splice(e, 1);
              if (enemy.type === "boss") {
                state = "victory";
                showOverlay("victory");
              }
            }
            break;
          }
          if (hit && state !== "playing") break;
        }
      }

      function updatePowerups(dt) {
        for (let i = powerups.length - 1; i >= 0; i--) {
          const item = powerups[i];
          item.phase += dt * 4;
          item.x += (item.vx + Math.sin(item.phase) * 20) * dt;
          item.y += item.vy * dt;
          if (item.y > H + item.radius) powerups.splice(i, 1);
          else if (Math.hypot(item.x - player.x, item.y - player.y) < item.radius + player.radius) {
            collectPowerup(item);
            powerups.splice(i, 1);
          }
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.max(0, 1 - dt * 1.8);
          particle.vy *= Math.max(0, 1 - dt * 1.8);
          particle.life -= dt;
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function drawShip(x, y, color, playerShip, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale || 1, scale || 1);
        ctx.shadowBlur = playerShip ? 18 : 12;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -21);
        ctx.lineTo(14, 14);
        ctx.lineTo(5, 9);
        ctx.lineTo(0, 15);
        ctx.lineTo(-5, 9);
        ctx.lineTo(-14, 14);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = playerShip ? "#dffcff" : "#381929";
        ctx.beginPath();
        ctx.ellipse(0, -2, 4, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.shadowBlur = 17;
        ctx.shadowColor = enemy.color;
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        if (enemy.type === "boss") {
          ctx.moveTo(-enemy.radius, -18);
          ctx.lineTo(-enemy.radius * 0.65, -enemy.radius * 0.72);
          ctx.lineTo(0, -enemy.radius * 0.92);
          ctx.lineTo(enemy.radius * 0.65, -enemy.radius * 0.72);
          ctx.lineTo(enemy.radius, -18);
          ctx.lineTo(enemy.radius * 0.76, enemy.radius * 0.48);
          ctx.lineTo(enemy.radius * 0.32, enemy.radius * 0.76);
          ctx.lineTo(0, enemy.radius * 0.55);
          ctx.lineTo(-enemy.radius * 0.32, enemy.radius * 0.76);
          ctx.lineTo(-enemy.radius * 0.76, enemy.radius * 0.48);
        } else if (enemy.type === "tank") {
          ctx.roundRect(-enemy.radius, -enemy.radius * 0.72, enemy.radius * 2, enemy.radius * 1.5, 7);
        } else {
          const sides = enemy.type === "gunner" ? 6 : 4;
          for (let i = 0; i < sides; i++) {
            const angle = (Math.PI * 2 * i / sides) - Math.PI / 2;
            const x = Math.cos(angle) * enemy.radius;
            const y = Math.sin(angle) * enemy.radius;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff4";
        ctx.beginPath();
        ctx.arc(0, 0, enemy.type === "boss" ? 14 : 4, 0, Math.PI * 2);
        ctx.fill();
        if (enemy.type === "boss") {
          ctx.fillStyle = "#172237";
          ctx.fillRect(-54, -enemy.radius - 15, 108, 6);
          ctx.fillStyle = "#ff5476";
          ctx.fillRect(-54, -enemy.radius - 15, 108 * Math.max(0, enemy.hp / enemy.maxHp), 6);
        }
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, "#0b1b31");
        gradient.addColorStop(1, "#07101d");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
        for (const star of stars) {
          ctx.globalAlpha = star.alpha;
          ctx.fillStyle = "#d4efff";
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
        ctx.globalAlpha = 1;

        for (const item of powerups) {
          ctx.save();
          ctx.shadowBlur = 18;
          ctx.shadowColor = item.color;
          ctx.strokeStyle = item.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(item.x, item.y, item.radius + Math.sin(item.phase * 2) * 1.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = item.color;
          ctx.font = "bold 12px Segoe UI";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(item.type === "rapid" ? "R" : "S", item.x, item.y);
          ctx.restore();
        }
        for (const enemy of enemies) drawEnemy(enemy);

        ctx.fillStyle = "#7df6ff";
        for (const shot of playerShots) {
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#67eafa";
          ctx.beginPath();
          ctx.ellipse(shot.x, shot.y, 3, 8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        for (const shot of enemyShots) {
          ctx.fillStyle = shot.color;
          ctx.beginPath();
          ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        ctx.globalAlpha = 1;

        if (player && state !== "ready") {
          if (player.invulnerable <= 0 || Math.floor(performance.now() / 90) % 2 === 0) {
            drawShip(player.x, player.y, "#67efff", true, 1);
          }
          if (player.rapidFor > 0 || player.spreadFor > 0) {
            ctx.fillStyle = "#c7f7ff";
            ctx.font = "10px Segoe UI";
            ctx.textAlign = "center";
            ctx.fillText(player.rapidFor > 0 ? "RAPID FIRE" : "ANGLED SHOTS", player.x, player.y + 31);
          }
        }

        const progress = scroll / LEVEL_DISTANCE;
        ctx.fillStyle = "#91afca44";
        ctx.fillRect(15, 14, W - 30, 3);
        ctx.fillStyle = "#62e7f4";
        ctx.fillRect(15, 14, (W - 30) * progress, 3);
      }

      function frame(now) {
        const dt = Math.min(0.034, (now - (lastTime || now)) / 1000);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * W / rect.width,
          y: (event.clientY - rect.top) * H / rect.height
        };
      }

      startButton.addEventListener("click", startOrResume);
      canvas.addEventListener("pointerdown", event => {
        pointerDown = true;
        pointerTarget = pointerPosition(event);
        canvas.setPointerCapture(event.pointerId);
        if (state === "ready") startOrResume();
      });
      canvas.addEventListener("pointermove", event => {
        if (pointerDown) pointerTarget = pointerPosition(event);
      });
      canvas.addEventListener("pointerup", () => { pointerDown = false; pointerTarget = null; });
      canvas.addEventListener("pointercancel", () => { pointerDown = false; pointerTarget = null; });
      window.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) event.preventDefault();
        if (key === "p" && (state === "playing" || state === "paused")) {
          if (state === "playing") { state = "paused"; showOverlay("paused"); }
          else startOrResume();
          return;
        }
        keys.add(key === " " ? " " : key);
        if (state === "ready" && (key === " " || key === "enter")) startOrResume();
      });
      window.addEventListener("keyup", event => {
        const key = event.key.toLowerCase();
        keys.delete(key === " " ? " " : key);
      });
      window.addEventListener("blur", () => {
        keys.clear();
        pointerDown = false;
        pointerTarget = null;
      });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

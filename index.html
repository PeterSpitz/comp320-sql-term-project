<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <title>Starline — Vertical Shooter</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background: #070b18;
      color: #eaf3ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(19, 47, 84, .48), transparent 58%),
        #070b18;
    }

    .cabinet {
      width: min(100vw, 1040px);
      height: min(100vh, 960px);
      min-height: 540px;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }

    .topbar, .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      color: #8df6ff;
      font-size: 19px;
      border: 1px solid rgba(105, 229, 255, .5);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(33, 99, 145, .5), rgba(11, 24, 48, .6));
      box-shadow: 0 0 22px rgba(46, 204, 255, .13);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .brand-tag {
      margin-top: 3px;
      color: #7185a7;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .status {
      color: #94a8c9;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status strong {
      margin-left: 6px;
      color: #8df6ff;
      font-size: 11px;
      letter-spacing: .08em;
    }

    .game-frame {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(104, 170, 223, .22);
      border-radius: 18px;
      background: #080f21;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45), inset 0 0 34px rgba(46, 117, 184, .1);
    }

    canvas {
      width: auto;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 2 / 3;
      display: block;
      outline: none;
      touch-action: none;
      background: #081326;
    }

    .bottombar {
      color: #7d91b3;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .key {
      display: inline-block;
      min-width: 20px;
      margin: 0 2px;
      padding: 3px 5px;
      color: #cbd9ee;
      text-align: center;
      border: 1px solid rgba(139, 165, 203, .25);
      border-radius: 5px;
      background: rgba(31, 46, 73, .55);
      font-size: 9px;
    }

    @media (max-width: 560px) {
      .cabinet {
        height: 100dvh;
        min-height: 0;
        padding: 10px;
        gap: 9px;
      }

      .brand-tag { display: none; }
      .brand-name { font-size: 12px; }
      .brand-mark { width: 30px; height: 30px; }
      .status { font-size: 8px; }
      .status strong { font-size: 9px; }
      .bottombar { font-size: 8px; }
      .key { min-width: 17px; padding: 2px 4px; font-size: 8px; }
      .game-frame { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <div class="brand-name">Starline</div>
          <div class="brand-tag">Sector 07 · Deep space run</div>
        </div>
      </div>
      <div class="status">Mission <strong id="mission-status">READY</strong></div>
    </header>

    <section class="game-frame" aria-label="Starline shooter game">
      <canvas id="game" width="480" height="720" tabindex="0" aria-label="Vertical space shooter. Move with WASD or arrow keys, fire with space, and pause with P."></canvas>
    </section>

    <footer class="bottombar">
      <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> MOVE <span class="key">SPACE</span> FIRE</div>
      <div><span class="key">P</span> PAUSE <span class="key">MOUSE</span> AIM + FIRE</div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const statusText = document.getElementById("mission-status");
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const LEVEL_DISTANCE = 9280;
      const SCREEN_SCROLL_SPEED = 150;
      const POWERUP_WEAPONS = { 2: "rapid", 3: "spread" };

      const enemyStyles = {
        scout: { hp: 1, radius: 13, speed: 102, score: 100, color: "#ff718e", fire: 0, shape: "diamond" },
        weaver: { hp: 2, radius: 15, speed: 82, score: 180, color: "#ffb56c", fire: 2.4, shape: "wing" },
        gunner: { hp: 3, radius: 17, speed: 61, score: 260, color: "#d18bff", fire: 1.65, shape: "hex" },
        tank: { hp: 7, radius: 23, speed: 44, score: 520, color: "#ff536d", fire: 1.3, shape: "tank" },
        boss: { hp: 92, radius: 56, speed: 0, score: 6000, color: "#ff426f", fire: .72, shape: "boss" }
      };

      // Keep this schedule in sync with level_map.sql.
      const spawnPlan = [
        { at: .02, type: "scout", lane: 50, count: 1 },
        { at: .08, type: "scout", lane: 27, count: 2 },
        { at: .14, type: "weaver", lane: 72, count: 2 },
        { at: .20, type: "scout", lane: 18, count: 3 },
        { at: .26, type: "gunner", lane: 50, count: 1, dropWeapon: 2 },
        { at: .32, type: "weaver", lane: 78, count: 3 },
        { at: .38, type: "tank", lane: 34, count: 1, dropWeapon: 3 },
        { at: .44, type: "gunner", lane: 68, count: 2 },
        { at: .50, type: "scout", lane: 22, count: 4 },
        { at: .56, type: "tank", lane: 72, count: 1, dropWeapon: 2 },
        { at: .62, type: "weaver", lane: 42, count: 3 },
        { at: .68, type: "gunner", lane: 24, count: 2, dropWeapon: 3 },
        { at: .73, type: "tank", lane: 53, count: 2 },
        { at: .78, type: "weaver", lane: 76, count: 4, dropWeapon: 2 },
        { at: .82, type: "gunner", lane: 36, count: 3 },
        { at: .86, type: "tank", lane: 66, count: 2, dropWeapon: 3 },
        { at: .98, type: "boss", lane: 50, count: 1, dropWeapon: 3 }
      ];

      const keys = new Set();
      const stars = Array.from({ length: 95 }, () => ({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: .5 + Math.random() * 1.7,
        speed: 18 + Math.random() * 82,
        alpha: .2 + Math.random() * .65
      }));

      let state = "ready";
      let lastTime = 0;
      let screenDistance = 0;
      let score = 0;
      let spawnIndex = 0;
      let fireTimer = 0;
      let damageFlash = 0;
      let pointerActive = false;
      let player;
      let enemies = [];
      let bullets = [];
      let enemyBullets = [];
      let powerups = [];
      let particles = [];

      function resetGame() {
        screenDistance = 0;
        score = 0;
        spawnIndex = 0;
        fireTimer = 0;
        damageFlash = 0;
        enemies = [];
        bullets = [];
        enemyBullets = [];
        powerups = [];
        particles = [];
        player = {
          x: WIDTH / 2, y: HEIGHT - 104, radius: 13,
          speed: 270, lives: 3, weapon: "standard",
          rapidTime: 0, spreadTime: 0, invulnerable: 1.8
        };
        state = "playing";
        statusText.textContent = "IN FLIGHT";
      }

      function startOrResume() {
        if (state === "ready" || state === "gameover" || state === "victory") resetGame();
        else if (state === "paused") {
          state = "playing";
          statusText.textContent = "IN FLIGHT";
        }
        canvas.focus();
      }

      function spawnGroup(group) {
        const style = enemyStyles[group.type];
        for (let i = 0; i < group.count; i++) {
          const spread = group.count === 1 ? 0 : (i - (group.count - 1) / 2) * 36;
          const enemy = {
            type: group.type,
            x: WIDTH * group.lane / 100 + spread,
            y: group.type === "boss" ? HEIGHT * .4 : 90 + i * 30,
            worldY: group.type === "boss" ? screenDistance + HEIGHT * .4 : null,
            radius: style.radius, hp: style.hp, maxHp: style.hp,
            speed: style.speed, score: style.score, color: style.color,
            fireRate: style.fire, fireTimer: .8 + Math.random(),
            phase: Math.random() * Math.PI * 2,
            drop: POWERUP_WEAPONS[group.dropWeapon]
              || (Math.random() < .24 ? (Math.random() < .55 ? "rapid" : "spread") : null)
          };
          enemies.push(enemy);
        }
      }

      function firePlayer() {
        const spreadActive = player.spreadTime > 0;
        const shots = spreadActive
          ? [{ x: -.2, y: -1 }, { x: 0, y: -1 }, { x: .2, y: -1 }]
          : [{ x: 0, y: -1 }];
        for (const shot of shots) {
          bullets.push({
            x: player.x + shot.x * 14, y: player.y - 20,
            vx: shot.x * 560, vy: shot.y * 560, radius: 4, damage: 1
          });
        }
        particles.push({ x: player.x, y: player.y - 20, vx: 0, vy: -32, life: .12, maxLife: .12, color: "#8df6ff", size: 8 });
      }

      function fireEnemy(enemy) {
        if (enemy.type === "boss") {
          for (let i = -2; i <= 2; i++) {
            enemyBullets.push({
              x: enemy.x + i * 17, y: enemy.y + 39,
              vx: i * 46 + (player.x - enemy.x) * .045, vy: 205,
              radius: 6, color: "#ff6682"
            });
          }
        } else {
          const dx = player.x - enemy.x;
          const dy = player.y - enemy.y;
          const length = Math.hypot(dx, dy) || 1;
          enemyBullets.push({
            x: enemy.x, y: enemy.y + enemy.radius,
            vx: dx / length * 105, vy: dy / length * 105,
            radius: 4, color: "#ff9b80"
          });
        }
      }

      function burst(x, y, color, count, force) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = force * (.35 + Math.random() * .75);
          const life = .25 + Math.random() * .55;
          particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life, maxLife: life, color, size: 1.5 + Math.random() * 3.5
          });
        }
      }

      function collectPowerup(powerup) {
        if (powerup.type === "rapid") player.rapidTime = 10;
        else player.spreadTime = 10;
        score += 150;
        burst(powerup.x, powerup.y, powerup.color, 16, 95);
      }

      function damagePlayer() {
        if (player.invulnerable > 0 || state !== "playing") return;
        player.lives--;
        player.invulnerable = 1.5;
        damageFlash = .3;
        burst(player.x, player.y, "#ff718e", 20, 140);
        if (player.lives <= 0) {
          state = "gameover";
          statusText.textContent = "SHIP LOST";
        }
      }

      function update(dt) {
        for (const star of stars) {
          star.y += star.speed * dt;
          if (star.y > HEIGHT) {
            star.y = -2;
            star.x = Math.random() * WIDTH;
          }
        }

        if (state !== "playing") return;

        screenDistance = Math.min(LEVEL_DISTANCE, screenDistance + SCREEN_SCROLL_SPEED * dt);
        const progress = screenDistance / LEVEL_DISTANCE;
        while (spawnIndex < spawnPlan.length && progress >= spawnPlan[spawnIndex].at) {
          spawnGroup(spawnPlan[spawnIndex]);
          spawnIndex++;
        }

        player.invulnerable = Math.max(0, player.invulnerable - dt);
        player.rapidTime = Math.max(0, player.rapidTime - dt);
        player.spreadTime = Math.max(0, player.spreadTime - dt);
        damageFlash = Math.max(0, damageFlash - dt);

        let moveX = 0;
        let moveY = 0;
        if (keys.has("ArrowLeft") || keys.has("a")) moveX--;
        if (keys.has("ArrowRight") || keys.has("d")) moveX++;
        if (keys.has("ArrowUp") || keys.has("w")) moveY--;
        if (keys.has("ArrowDown") || keys.has("s")) moveY++;
        const magnitude = Math.hypot(moveX, moveY) || 1;
        player.x += moveX / magnitude * player.speed * dt;
        player.y += moveY / magnitude * player.speed * dt;
        player.x = Math.max(player.radius + 5, Math.min(WIDTH - player.radius - 5, player.x));
        player.y = Math.max(HEIGHT * .42, Math.min(HEIGHT - player.radius - 20, player.y));

        fireTimer -= dt;
        const firing = keys.has(" ") || pointerActive;
        if (firing && fireTimer <= 0) {
          firePlayer();
          fireTimer = player.rapidTime > 0 ? .115 : .27;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const enemy = enemies[i];
          enemy.phase += dt * (enemy.type === "boss" ? .75 : 1.8);
          if (enemy.type === "boss") {
            enemy.y = enemy.worldY - screenDistance;
            enemy.x = WIDTH / 2 + Math.sin(enemy.phase) * 120;
          } else {
            enemy.y += enemy.speed * dt;
            if (enemy.type === "weaver") enemy.x += Math.sin(enemy.phase) * 72 * dt;
            else if (enemy.type === "gunner") enemy.x += Math.sin(enemy.phase) * 20 * dt;
          }
          enemy.x = Math.max(enemy.radius + 4, Math.min(WIDTH - enemy.radius - 4, enemy.x));
          if (enemy.fireRate > 0) {
            enemy.fireTimer -= dt;
            if (enemy.fireTimer <= 0 && enemy.y > 0 && enemy.y < HEIGHT * .76) {
              fireEnemy(enemy);
              enemy.fireTimer = enemy.fireRate;
            }
          }
          if (enemy.type !== "boss" && enemy.y > HEIGHT + enemy.radius) enemies.splice(i, 1);
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          const bullet = bullets[i];
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
          if (bullet.y < -10 || bullet.x < -10 || bullet.x > WIDTH + 10) bullets.splice(i, 1);
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const bullet = enemyBullets[i];
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
          if (bullet.y > HEIGHT + 10 || bullet.x < -10 || bullet.x > WIDTH + 10) {
            enemyBullets.splice(i, 1);
            continue;
          }
          if (Math.hypot(bullet.x - player.x, bullet.y - player.y) < bullet.radius + player.radius * .72) {
            enemyBullets.splice(i, 1);
            damagePlayer();
          }
        }

        for (let b = bullets.length - 1; b >= 0; b--) {
          const bullet = bullets[b];
          let hit = false;
          for (let e = enemies.length - 1; e >= 0; e--) {
            const enemy = enemies[e];
            if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) >= bullet.radius + enemy.radius * .8) continue;
            enemy.hp -= bullet.damage;
            bullets.splice(b, 1);
            hit = true;
            burst(bullet.x, bullet.y, enemy.color, 4, 55);
            if (enemy.hp <= 0) {
              score += enemy.score;
              burst(enemy.x, enemy.y, enemy.color, enemy.type === "boss" ? 65 : 18, enemy.type === "boss" ? 190 : 115);
              if (enemy.drop) {
                const color = enemy.drop === "rapid" ? "#73f3c0" : "#86bcff";
                powerups.push({
                  x: enemy.x, y: enemy.y, type: enemy.drop, radius: 12,
                  speed: 76, color, phase: 0
                });
              }
              enemies.splice(e, 1);
              if (enemy.type === "boss") {
                state = "victory";
                statusText.textContent = "SECTOR CLEAR";
              }
            }
            break;
          }
          if (hit) continue;
        }

        for (let i = powerups.length - 1; i >= 0; i--) {
          const powerup = powerups[i];
          powerup.y += powerup.speed * dt;
          powerup.phase += dt * 5;
          powerup.x += Math.sin(powerup.phase) * 18 * dt;
          if (powerup.y > HEIGHT + powerup.radius) {
            powerups.splice(i, 1);
          } else if (Math.hypot(powerup.x - player.x, powerup.y - player.y) < powerup.radius + player.radius) {
            collectPowerup(powerup);
            powerups.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.max(0, 1 - dt * 1.8);
          particle.vy *= Math.max(0, 1 - dt * 1.8);
          particle.life -= dt;
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function drawShip(x, y, scale, color, isPlayer) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.shadowBlur = isPlayer ? 18 : 12;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -21);
        ctx.lineTo(13, 13);
        ctx.lineTo(5, 9);
        ctx.lineTo(0, 15);
        ctx.lineTo(-5, 9);
        ctx.lineTo(-13, 13);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = isPlayer ? "#eaffff" : "#25152c";
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(4, 5);
        ctx.lineTo(-4, 5);
        ctx.closePath();
        ctx.fill();
        if (isPlayer) {
          ctx.fillStyle = "rgba(91, 231, 255, .72)";
          ctx.beginPath();
          ctx.moveTo(-4, 13); ctx.lineTo(0, 22 + Math.random() * 5); ctx.lineTo(4, 13);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.shadowColor = enemy.color;
        ctx.shadowBlur = enemy.type === "boss" ? 24 : 12;
        ctx.fillStyle = enemy.color;
        ctx.strokeStyle = "rgba(255,255,255,.68)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        if (enemy.type === "boss") {
          ctx.moveTo(0, -48);
          ctx.lineTo(31, -30); ctx.lineTo(49, -10); ctx.lineTo(39, 28);
          ctx.lineTo(18, 44); ctx.lineTo(0, 36); ctx.lineTo(-18, 44);
          ctx.lineTo(-39, 28); ctx.lineTo(-49, -10); ctx.lineTo(-31, -30);
        } else if (enemy.type === "weaver") {
          ctx.moveTo(0, 17); ctx.lineTo(13, 5); ctx.lineTo(25, -12);
          ctx.lineTo(7, -7); ctx.lineTo(0, -17); ctx.lineTo(-7, -7);
          ctx.lineTo(-25, -12); ctx.lineTo(-13, 5);
        } else if (enemy.type === "tank") {
          ctx.rect(-20, -17, 40, 34);
          ctx.moveTo(-14, -17); ctx.lineTo(0, -27); ctx.lineTo(14, -17);
          ctx.moveTo(-9, 17); ctx.lineTo(-9, 24); ctx.lineTo(9, 24); ctx.lineTo(9, 17);
        } else if (enemy.type === "gunner") {
          for (let i = 0; i < 6; i++) {
            const a = i * Math.PI / 3 - Math.PI / 2;
            const px = Math.cos(a) * 18, py = Math.sin(a) * 18;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
        } else {
          ctx.moveTo(0, 19); ctx.lineTo(16, -12); ctx.lineTo(0, -18); ctx.lineTo(-16, -12);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#fff1f4";
        if (enemy.type === "boss") {
          ctx.fillRect(-24, -9, 11, 4);
          ctx.fillRect(13, -9, 11, 4);
          ctx.fillStyle = "rgba(20, 9, 25, .6)";
          ctx.fillRect(-33, 51, 66, 4);
          ctx.fillStyle = "#ff5578";
          ctx.fillRect(-33, 51, 66 * Math.max(0, enemy.hp / enemy.maxHp), 4);
        } else {
          ctx.fillRect(-2, -4, 4, 4);
        }
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        const bg = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        bg.addColorStop(0, "#0b1c35");
        bg.addColorStop(.52, "#09162a");
        bg.addColorStop(1, "#080f20");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (const star of stars) {
          ctx.globalAlpha = star.alpha;
          ctx.fillStyle = "#c8e8ff";
          ctx.fillRect(star.x, star.y, star.size, star.size * 1.8);
        }
        ctx.globalAlpha = 1;

        const scrollTicks = Math.floor(screenDistance) % 80;
        ctx.strokeStyle = "rgba(86, 148, 204, .045)";
        ctx.lineWidth = 1;
        for (let y = scrollTicks - 80; y < HEIGHT; y += 80) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WIDTH, y); ctx.stroke();
        }

        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.shadowColor = particle.color;
          ctx.shadowBlur = 9;
          ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        for (const bullet of bullets) {
          ctx.fillStyle = "#9ff8ff";
          ctx.shadowColor = "#62edff";
          ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.ellipse(bullet.x, bullet.y, bullet.radius, bullet.radius * 1.8, 0, 0, Math.PI * 2); ctx.fill();
        }
        for (const bullet of enemyBullets) {
          ctx.fillStyle = bullet.color;
          ctx.shadowColor = bullet.color;
          ctx.shadowBlur = 11;
          ctx.beginPath(); ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

        for (const enemy of enemies) drawEnemy(enemy);

        for (const powerup of powerups) {
          ctx.save();
          ctx.translate(powerup.x, powerup.y);
          ctx.rotate(Math.PI / 4 + Math.sin(powerup.phase) * .12);
          ctx.shadowColor = powerup.color;
          ctx.shadowBlur = 17;
          ctx.fillStyle = powerup.color;
          ctx.fillRect(-10, -10, 20, 20);
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#102033";
          ctx.font = "bold 13px Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(powerup.type === "rapid" ? "»" : "✦", 0, 0);
          ctx.restore();
        }

        if (player && state !== "ready") {
          if (player.invulnerable <= 0 || Math.floor(screenDistance / SCREEN_SCROLL_SPEED * 12) % 2 === 0) {
            drawShip(player.x, player.y, 1, "#65eaff", true);
          }
        }

        drawHud();
        if (state !== "playing") drawOverlay();
        if (damageFlash > 0) {
          ctx.fillStyle = `rgba(255, 65, 98, ${damageFlash * .28})`;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
      }

      function drawHud() {
        const progress = state === "ready" ? 0 : screenDistance / LEVEL_DISTANCE;
        ctx.fillStyle = "rgba(6, 12, 27, .7)";
        ctx.fillRect(15, 15, WIDTH - 30, 55);
        ctx.strokeStyle = "rgba(132, 190, 235, .16)";
        ctx.strokeRect(15.5, 15.5, WIDTH - 31, 54);
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#8298ba";
        ctx.font = "700 9px Segoe UI, sans-serif";
        ctx.fillText("SCREEN PROGRESS", 27, 34);
        ctx.fillStyle = "#e7f2ff";
        ctx.font = "700 15px Segoe UI, sans-serif";
        ctx.fillText(`${Math.floor(progress * 100)}%`, 27, 56);
        ctx.fillStyle = "rgba(135, 164, 203, .2)";
        ctx.fillRect(88, 46, 174, 5);
        const bar = ctx.createLinearGradient(88, 0, 262, 0);
        bar.addColorStop(0, "#55dff3"); bar.addColorStop(1, "#8b91ff");
        ctx.fillStyle = bar;
        ctx.fillRect(88, 46, 174 * progress, 5);

        ctx.textAlign = "right";
        ctx.fillStyle = "#8298ba";
        ctx.font = "700 9px Segoe UI, sans-serif";
        ctx.fillText("SCORE", WIDTH - 27, 34);
        ctx.fillStyle = "#e7f2ff";
        ctx.font = "700 17px Segoe UI, sans-serif";
        ctx.fillText(String(score).padStart(6, "0"), WIDTH - 27, 56);

        ctx.textAlign = "left";
        ctx.fillStyle = "#8298ba";
        ctx.font = "700 9px Segoe UI, sans-serif";
        ctx.fillText("HULL", 22, 94);
        if (player) {
          for (let i = 0; i < 3; i++) {
            ctx.fillStyle = i < player.lives ? "#ff708d" : "rgba(255,112,141,.2)";
            ctx.beginPath();
            ctx.arc(65 + i * 16, 91, 5, 0, Math.PI * 2);
            ctx.fill();
          }
          const active = [];
          if (player.rapidTime > 0) active.push(`RAPID ${Math.ceil(player.rapidTime)}s`);
          if (player.spreadTime > 0) active.push(`SPREAD ${Math.ceil(player.spreadTime)}s`);
          if (active.length) {
            ctx.textAlign = "right";
            ctx.fillStyle = "#83f2d0";
            ctx.font = "700 9px Segoe UI, sans-serif";
            ctx.fillText(active.join("   "), WIDTH - 22, 94);
          }
        }
      }

      function drawOverlay() {
        ctx.fillStyle = "rgba(4, 9, 21, .76)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (state === "ready") {
          ctx.fillStyle = "#8df6ff";
          ctx.font = "700 10px Segoe UI, sans-serif";
          ctx.fillText("FLIGHT DECK  /  SECTOR 07", WIDTH / 2, HEIGHT / 2 - 104);
          ctx.fillStyle = "#f0f7ff";
          ctx.font = "800 45px Segoe UI, sans-serif";
          ctx.fillText("STARLINE", WIDTH / 2, HEIGHT / 2 - 48);
          ctx.fillStyle = "#a9bad3";
          ctx.font = "14px Segoe UI, sans-serif";
          ctx.fillText("Hold the line. Clear the sector.", WIDTH / 2, HEIGHT / 2 - 8);
          drawButton("LAUNCH MISSION", HEIGHT / 2 + 57);
          ctx.fillStyle = "#7388a8";
          ctx.font = "11px Segoe UI, sans-serif";
          ctx.fillText("FIRST CONTACT AT 2%  ·  BOSS NEAR SCREEN LIMIT", WIDTH / 2, HEIGHT / 2 + 116);
        } else if (state === "paused") {
          ctx.fillStyle = "#f0f7ff";
          ctx.font = "800 35px Segoe UI, sans-serif";
          ctx.fillText("PAUSED", WIDTH / 2, HEIGHT / 2 - 28);
          drawButton("RESUME", HEIGHT / 2 + 32);
        } else if (state === "gameover" || state === "victory") {
          const won = state === "victory";
          ctx.fillStyle = won ? "#8df6ff" : "#ff8297";
          ctx.font = "700 10px Segoe UI, sans-serif";
          ctx.fillText(won ? "SECTOR 07 SECURED" : "SIGNAL LOST", WIDTH / 2, HEIGHT / 2 - 78);
          ctx.fillStyle = "#f0f7ff";
          ctx.font = "800 34px Segoe UI, sans-serif";
          ctx.fillText(won ? "MISSION CLEAR" : "SHIP DOWN", WIDTH / 2, HEIGHT / 2 - 31);
          ctx.fillStyle = "#a9bad3";
          ctx.font = "14px Segoe UI, sans-serif";
          ctx.fillText(`FINAL SCORE  ${String(score).padStart(6, "0")}`, WIDTH / 2, HEIGHT / 2 + 5);
          drawButton("FLY AGAIN", HEIGHT / 2 + 65);
        }
      }

      function drawButton(label, y) {
        const x = WIDTH / 2 - 91;
        ctx.fillStyle = "rgba(70, 207, 231, .16)";
        ctx.strokeStyle = "rgba(116, 234, 255, .7)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x, y - 20, 182, 40, 9);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#b9f8ff";
        ctx.font = "700 11px Segoe UI, sans-serif";
        ctx.fillText(label, WIDTH / 2, y + .5);
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, .04);
        lastTime = time;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * WIDTH / rect.width,
          y: (event.clientY - rect.top) * HEIGHT / rect.height
        };
      }

      function aimAt(event) {
        const point = pointerPosition(event);
        if (state === "playing") {
          player.x = Math.max(player.radius + 5, Math.min(WIDTH - player.radius - 5, point.x));
          player.y = Math.max(HEIGHT * .42, Math.min(HEIGHT - player.radius - 20, point.y));
        }
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) event.preventDefault();
        if (key === "p" || key === "Escape") {
          if (state === "playing") {
            state = "paused";
            statusText.textContent = "PAUSED";
          } else if (state === "paused") startOrResume();
          return;
        }
        if (key === "Enter" && state !== "playing") {
          startOrResume();
          return;
        }
        keys.add(key);
      });

      document.addEventListener("keyup", (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });

      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (state !== "playing") {
          startOrResume();
          return;
        }
        pointerActive = true;
        aimAt(event);
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", (event) => {
        if (state === "playing" && (event.pointerType === "touch" || pointerActive)) aimAt(event);
      });

      canvas.addEventListener("pointerup", () => { pointerActive = false; });
      canvas.addEventListener("pointercancel", () => { pointerActive = false; });
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") {
          state = "paused";
          statusText.textContent = "PAUSED";
        }
      });

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>

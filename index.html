<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skyline Strike</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(61, 88, 151, 0.28), transparent 28rem),
        #080d1a;
      color: #eef7ff;
    }

    .game-shell {
      position: relative;
      width: min(92vw, 720px);
      aspect-ratio: 4 / 5;
      border: 1px solid rgba(142, 219, 255, 0.25);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), inset 0 0 30px rgba(78, 184, 255, 0.08);
      background: #0a1020;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: absolute;
      inset: 16px 18px auto;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 8px #050711;
    }

    .hud strong { color: #73ddff; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(5, 9, 22, 0.72);
      backdrop-filter: blur(5px);
    }

    .overlay.hidden { display: none; }

    .panel {
      max-width: 390px;
      padding: 28px;
      border: 1px solid rgba(115, 221, 255, 0.35);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(18, 31, 58, 0.96), rgba(8, 13, 29, 0.96));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1;
      letter-spacing: 0.04em;
    }

    p {
      margin: 12px 0 20px;
      color: #aabbd3;
      line-height: 1.5;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #65d8ff, #4f8cff);
      color: #07101e;
      font: 900 14px/1 inherit;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(73, 151, 255, 0.28);
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .controls {
      margin-top: 14px;
      font-size: 12px;
      color: #7f91aa;
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Vertical shooter game">
    <canvas id="game" width="720" height="900"></canvas>
    <div class="hud" aria-live="polite">
      <span>SCORE <strong id="score">0000</strong></span>
      <span>WEAPON <strong id="weapon">STANDARD</strong></span>
      <span>SHIELD <strong id="lives">10</strong></span>
    </div>
    <section class="overlay" id="overlay">
      <div class="panel">
        <h1 id="title">SKYLINE<br>STRIKE</h1>
        <p id="message">Defend the upper airspace. Destroy enemies before they pass your wing.</p>
        <button id="start" type="button">START MISSION</button>
        <div class="controls">Move: WASD / Arrow keys &nbsp;&nbsp; Fire: Space / Z</div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.getElementById("score");
      const livesLabel = document.getElementById("lives");
      const weaponLabel = document.getElementById("weapon");
      const overlay = document.getElementById("overlay");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const startButton = document.getElementById("start");

      const keys = new Set();
      let playing = false;
      let lastTime = 0;
      let elapsed = 0;
      let spawnTimer = 0;
      let score = 0;
      let lives = 10;
      let scroll = 0;
      let player;
      let bullets = [];
      let enemies = [];
      let enemyBullets = [];
      let particles = [];
      let stars = [];
      let powerups = [];
      let levelQueue = [];

      function makeStars() {
        stars = Array.from({ length: 90 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 55 + 25
        }));
      }

      function resetGame() {
        player = {
          x: canvas.width / 2,
          y: canvas.height - 110,
          radius: 18,
          speed: 330,
          fireCooldown: 0,
          weaponMode: "standard"
        };
        bullets = [];
        enemies = [];
        enemyBullets = [];
        particles = [];
        powerups = [
          { x: 300, y: 260, radius: 12, vx: 0, vy: -25, type: "rapid", activeAt: 4 },
          { x: 420, y: 520, radius: 12, vx: 0, vy: -25, type: "spread", activeAt: 12 }
        ];
        powerups.forEach(powerup => { powerup.spawned = false; });
        levelQueue = makeLevelQueue();
        elapsed = 0;
        spawnTimer = 0;
        score = 0;
        lives = 10;
        scroll = 0;
        updateHud();
      }

      function updateHud() {
        scoreLabel.textContent = String(score).padStart(4, "0");
        livesLabel.textContent = lives;
        weaponLabel.textContent = player
          ? player.weaponMode === "rapid"
            ? "RAPID"
            : player.weaponMode === "spread"
              ? "SPREAD"
              : "STANDARD"
          : "STANDARD";
      }

      function startGame() {
        resetGame();
        playing = true;
        overlay.classList.add("hidden");
        lastTime = performance.now();
        requestAnimationFrame(loop);
      }

      function endGame(won) {
        playing = false;
        title.innerHTML = won ? "AIRSPACE<br>CLEAR" : "MISSION<br>FAILED";
        message.textContent = won
          ? `Mission complete. Final score: ${score}.`
          : `The enemy broke through. Final score: ${score}.`;
        startButton.textContent = "FLY AGAIN";
        overlay.classList.remove("hidden");
      }

      function spawnEnemy() {
        const wave = Math.floor(elapsed / 18);
        const radius = 16 + Math.random() * 7;
        const type = wave > 1 && Math.random() < 0.25 ? "heavy" : "scout";
        enemies.push({
          x: radius + 35 + Math.random() * (canvas.width - (radius + 35) * 2),
          y: -40,
          radius: type === "heavy" ? radius + 7 : radius,
          type,
          lives: type === "heavy" ? 3 : 1,
          speed: 75 + wave * 8 + Math.random() * 45,
          phase: Math.random() * Math.PI * 2,
          fireCooldown: 1 + Math.random() * 2
        });
      }

      function makeLevelQueue() {
        const formations = [
          { activeAt: 0.5, x: [120, 240, 360, 480, 600], speed: 75, lives: 1 },
          { activeAt: 5, x: [180, 300, 420, 540], speed: 95, lives: 1 },
          { activeAt: 10, x: [220, 500, 360], speed: 110, lives: 3 },
          { activeAt: 16, x: [120, 240, 360, 480, 600], speed: 125, lives: 1 }
        ];
        return formations.flatMap((formation, formationIndex) =>
          formation.x.map((x, index) => ({
            activeAt: formation.activeAt + index * 0.18,
            x,
            speed: formation.speed,
            lives: formation.lives,
            radius: formation.lives === 3 ? 23 : 16,
            phase: formationIndex + index,
            spawned: false
          }))
        );
      }

      function firePlayer() {
        if (player.fireCooldown <= 0) {
          bullets.push({ x: player.x, y: player.y - 24, radius: 4, vx: 0, vy: -620 });
          if (player.weaponMode === "spread") {
            bullets.push(
              { x: player.x, y: player.y - 24, radius: 4, vx: 180, vy: -620 },
              { x: player.x, y: player.y - 24, radius: 4, vx: -180, vy: -620 }
            );
          }
          player.fireCooldown = player.weaponMode === "rapid" ? 0.05 : 0.16;
        }
      }

      function fireEnemy(enemy) {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const length = Math.hypot(dx, dy) || 1;
        enemyBullets.push({
          x: enemy.x,
          y: enemy.y + enemy.radius,
          radius: 5,
          vx: (dx / length) * 175,
          vy: (dy / length) * 175
        });
      }

      function burst(x, y, color, count = 12) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * 180;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.35 + Math.random() * 0.45,
            color,
            size: 2 + Math.random() * 4
          });
        }
      }

      function circleHit(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const radii = (a.radius || 0) + (b.radius || 0);
        return dx * dx + dy * dy < radii * radii;
      }

      function update(dt) {
        elapsed += dt;
        scroll += 75 * dt;

        const left = keys.has("ArrowLeft") || keys.has("a");
        const right = keys.has("ArrowRight") || keys.has("d");
        const up = keys.has("ArrowUp") || keys.has("w");
        const down = keys.has("ArrowDown") || keys.has("s");
        let dx = (right ? 1 : 0) - (left ? 1 : 0);
        let dy = (down ? 1 : 0) - (up ? 1 : 0);
        if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
        player.x += dx * player.speed * dt;
        player.y += dy * player.speed * dt;
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(50, Math.min(canvas.height - player.radius, player.y));

        if (keys.has(" ") || keys.has("z")) firePlayer();
        player.fireCooldown -= dt;

        levelQueue.forEach(entry => {
          if (!entry.spawned && elapsed >= entry.activeAt) {
            entry.spawned = true;
            enemies.push({
              x: entry.x,
              y: -entry.radius - 24,
              radius: entry.radius,
              type: entry.lives > 1 ? "heavy" : "scout",
              lives: entry.lives,
              speed: entry.speed,
              phase: entry.phase,
              fireCooldown: 1.2 + entry.phase * 0.12
            });
          }
        });

        powerups.forEach(powerup => {
          if (!powerup.spawned && elapsed >= powerup.activeAt) powerup.spawned = true;
          if (powerup.spawned) {
            powerup.x += powerup.vx * dt;
            powerup.y += powerup.vy * dt;
          }
        });

        bullets.forEach(bullet => {
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
        });
        enemyBullets.forEach(bullet => {
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
        });

        enemies.forEach(enemy => {
          enemy.y += enemy.speed * dt;
          enemy.x += Math.sin(enemy.phase + elapsed * 2) * 38 * dt;
          enemy.fireCooldown -= dt;
          if (enemy.fireCooldown <= 0 && enemy.y > 40 && enemy.y < canvas.height * 0.72) {
            fireEnemy(enemy);
            enemy.fireCooldown = enemy.type === "heavy" ? 1.5 : 2.4 + Math.random();
          }
        });

        bullets = bullets.filter(bullet =>
          bullet.y > -20 &&
          bullet.x > -30 &&
          bullet.x < canvas.width + 30
        );
        enemyBullets = enemyBullets.filter(bullet =>
          bullet.x > -30 && bullet.x < canvas.width + 30 &&
          bullet.y > -30 && bullet.y < canvas.height + 30
        );
        enemies = enemies.filter(enemy => enemy.y < canvas.height + 50);

        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          for (let ei = enemies.length - 1; ei >= 0; ei--) {
            if (circleHit(bullets[bi], enemies[ei])) {
              bullets.splice(bi, 1);
              const enemy = enemies[ei];
              enemy.lives--;
              burst(enemy.x, enemy.y, enemy.type === "heavy" ? "#ff9b70" : "#70dfff", 5);
              if (enemy.lives <= 0) {
                burst(enemy.x, enemy.y, "#70dfff", 18);
                enemies.splice(ei, 1);
                score += enemy.type === "heavy" ? 250 : 100;
                updateHud();
              }
              break;
            }
          }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          if (circleHit(enemyBullets[i], player)) {
            enemyBullets.splice(i, 1);
            lives--;
            burst(player.x, player.y, "#ff5f78", 14);
            updateHud();
            if (lives <= 0) { endGame(false); return; }
          }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          if (circleHit(enemies[i], player) || enemies[i].y > canvas.height - 20) {
            if (circleHit(enemies[i], player)) lives -= 3;
            else lives--;
            burst(enemies[i].x, enemies[i].y, "#ff816f", 12);
            enemies.splice(i, 1);
            updateHud();
            if (lives <= 0) { endGame(false); return; }
          }
        }

        for (let i = powerups.length - 1; i >= 0; i--) {
          const powerup = powerups[i];
          if (powerup.spawned && circleHit(powerup, player)) {
            player.weaponMode = powerup.type;
            powerups.splice(i, 1);
            burst(player.x, player.y, powerup.type === "rapid" ? "#70ffb1" : "#d99cff", 18);
            updateHud();
          } else if (
            powerup.spawned &&
            (powerup.y < -30 || powerup.y > canvas.height + 30 ||
              powerup.x < -30 || powerup.x > canvas.width + 30)
          ) {
            powerups.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.life -= dt;
          if (particle.life <= 0) particles.splice(i, 1);
        }

        stars.forEach(star => {
          star.y += star.speed * dt;
          if (star.y > canvas.height) {
            star.y = -10;
            star.x = Math.random() * canvas.width;
          }
        });

        if (elapsed >= 3200 / 75) endGame(true);
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#09152d");
        gradient.addColorStop(0.62, "#0b1b32");
        gradient.addColorStop(1, "#15233a");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(152, 208, 255, 0.7)";
        stars.forEach(star => ctx.fillRect(star.x, star.y, star.size, star.size));

        ctx.strokeStyle = "rgba(83, 170, 210, 0.10)";
        ctx.lineWidth = 1;
        const spacing = 90;
        for (let y = (scroll % spacing) - spacing; y < canvas.height + spacing; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        for (let x = 0; x < canvas.width; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = "#57d8ff";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#dff7ff";
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(22, 18);
        ctx.lineTo(8, 14);
        ctx.lineTo(0, 23);
        ctx.lineTo(-8, 14);
        ctx.lineTo(-22, 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#4f9cff";
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(7, 8);
        ctx.lineTo(0, 14);
        ctx.lineTo(-7, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(Math.PI);
        ctx.shadowColor = enemy.type === "heavy" ? "#ff786f" : "#55cfff";
        ctx.shadowBlur = 12;
        ctx.fillStyle = enemy.type === "heavy" ? "#ff9d78" : "#69c8ff";
        ctx.beginPath();
        ctx.moveTo(0, -enemy.radius - 8);
        ctx.lineTo(enemy.radius, enemy.radius);
        ctx.lineTo(7, enemy.radius - 3);
        ctx.lineTo(0, enemy.radius + 6);
        ctx.lineTo(-7, enemy.radius - 3);
        ctx.lineTo(-enemy.radius, enemy.radius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        drawBackground();

        powerups.forEach(powerup => {
          if (!powerup.spawned) return;
          ctx.save();
          ctx.translate(powerup.x, powerup.y);
          ctx.rotate(powerup.type === "rapid" ? elapsed : -elapsed);
          ctx.shadowColor = powerup.type === "rapid" ? "#70ffb1" : "#d99cff";
          ctx.shadowBlur = 16;
          ctx.fillStyle = powerup.type === "rapid" ? "#70ffb1" : "#d99cff";
          ctx.beginPath();
          ctx.moveTo(0, -powerup.radius);
          ctx.lineTo(powerup.radius, 0);
          ctx.lineTo(0, powerup.radius);
          ctx.lineTo(-powerup.radius, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });

        ctx.fillStyle = "#87efff";
        ctx.shadowColor = "#87efff";
        ctx.shadowBlur = 10;
        bullets.forEach(bullet => ctx.fillRect(bullet.x - 2, bullet.y - 9, 4, 18));

        ctx.fillStyle = "#ff7184";
        ctx.shadowColor = "#ff7184";
        enemyBullets.forEach(bullet => {
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.shadowBlur = 0;
        enemies.forEach(drawEnemy);

        particles.forEach(particle => {
          ctx.globalAlpha = Math.min(1, particle.life * 2);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        });
        ctx.globalAlpha = 1;

        drawPlayer();
      }

      function loop(time) {
        if (!playing) return;
        const dt = Math.min((time - lastTime) / 1000, 0.033);
        lastTime = time;
        update(dt);
        draw();
        if (playing) requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "z"].includes(key)) event.preventDefault();
        keys.add(key);
      });
      window.addEventListener("keyup", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });

      canvas.addEventListener("pointermove", event => {
        if (!playing) return;
        const rect = canvas.getBoundingClientRect();
        player.x = (event.clientX - rect.left) * (canvas.width / rect.width);
        player.y = (event.clientY - rect.top) * (canvas.height / rect.height);
      });
      canvas.addEventListener("pointerdown", event => {
        canvas.setPointerCapture(event.pointerId);
        if (playing) firePlayer();
      });

      startButton.addEventListener("click", startGame);
      makeStars();
      resetGame();
      draw();
    })();
  </script>
</body>
</html>
